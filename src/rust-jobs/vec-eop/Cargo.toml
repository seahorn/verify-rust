cargo-features = ["profile-rustflags"]

[package]
name = "vec-eop-lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
# Error-on-panic twin of ../vec: same source, different panic semantics.
path = "../vec/lib.rs"

[dependencies]
libc = "0.2"
cfg-if = "0.1.10"

[dependencies.verifier]
path = "../../verifier/src"
default-features = false
# panic_error forwards to sea/panic_error, so the #[panic_handler] calls
# verifier_error() instead of aborting. Requires CUSTOM_PANIC_NO_STD in
# CMakeLists so std is built without panic_immediate_abort, or the handler is
# never reached.
features = ["no_std", "panic_error"]

[dependencies.sea]
path = "../../sea-lib"
default-features = false
features = []

[features]
default = []
