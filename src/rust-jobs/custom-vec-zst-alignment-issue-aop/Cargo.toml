cargo-features = ["profile-rustflags"]

[package]
name = "custom-vec-zst-alignment-issue-aop-lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
# Abort-on-panic twin of ../custom-vec-zst-alignment-issue: same source, panics pruned not reported.
path = "../custom-vec-zst-alignment-issue/lib.rs"

[dependencies]
libc = "0.2"
cfg-if = "0.1.10"

[dependencies.verifier]
path = "../../verifier/src"
default-features = false
features = ["no_std"]

[dependencies.sea]
path = "../../sea-lib"
default-features = false
features = []

[features]
default = []  # Specify other default features here, if any        
