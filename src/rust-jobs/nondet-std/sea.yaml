verify_options:
  # any_vec/any_string are at most 4 long; loops over them (e.g. from_utf8)
  # need at least that many iterations or longer values are silently cut
  bound: 4
  # any_string copies a nondet-length byte slice into the heap (memcpy with a
  # symbolic length). At the default word size 8 SeaHorn loses the copied
  # bytes: every specific string content is then unreachable (e.g.
  # testfail_string_emoji says unsat). Word size 1 models it correctly.
  horn-bv2-word-size: 1
